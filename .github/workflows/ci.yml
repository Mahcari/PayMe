name: PayMe Soroban Contracts CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payme-contracts-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test-build:
    name: Rust Checks, Tests, and Soroban Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "contracts -> target"

      - name: Verify formatting
        run: cargo fmt --manifest-path contracts/Cargo.toml --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --manifest-path contracts/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path contracts/Cargo.toml --workspace --all-targets

      - name: Install Stellar CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://developer.stellar.org/releases/stellar-cli/install.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build optimized WASM contracts
        working-directory: contracts
        run: stellar contract build
