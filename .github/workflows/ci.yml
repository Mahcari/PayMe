name: PayMe Soroban Contracts CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payme-contracts-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test-build:
    name: Rust Checks, Tests, and Soroban Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt,rust-src
          targets: wasm32-unknown-unknown

      - name: Ensure toolchain is default
        run: rustup default stable

      # Swatinem/rust-cache caches both target/ and ~/.cargo/ registries automatically
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

     
      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v26.0.0

      - name: Verify Stellar CLI Version
        run: stellar --version

      - name: Build optimized WASM contracts
        run: stellar contract build